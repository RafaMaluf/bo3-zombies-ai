name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app scripts tests

      - name: Test
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Validate knowledge base
        run: python -m scripts.validate_kb

      - name: Evaluate retrieval quality
        run: python -m scripts.evaluate_retrieval

      - name: Evaluate Zombies Chronicles retrieval quality
        run: >-
          python -m scripts.evaluate_retrieval
          --suite evals/chronicles_queries.json
          --report .cache/reports/chronicles-retrieval-eval.json

      - name: Evaluate multilingual retrieval quality
        run: >-
          python -m scripts.evaluate_retrieval
          --suite evals/multilingual_queries.json
          --report .cache/reports/multilingual-retrieval-eval.json
